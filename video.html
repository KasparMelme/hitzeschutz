<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video – Heiße Schicht</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --bg-deep:#1c1410; --bg-card:#2a1f18; --accent:#ff7a3d; --accent-soft:#ffb38a; --text-main:#f5ece4; --text-muted:#c7b8ad; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:radial-gradient(circle at 30% 20%, #3a2418 0%, var(--bg-deep) 55%); color:var(--text-main); padding:24px; }
  .card { max-width:760px; width:100%; background:var(--bg-card); border-radius:20px; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,0.4); border:1px solid rgba(255,122,61,0.15); }
  .card.narrow { max-width:460px; }
  .heat-bar { height:4px; width:100%; border-radius:4px; background:linear-gradient(90deg,#ffd166,var(--accent),#c1440e); margin-bottom:24px; }
  .eyebrow { font-size:0.75rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent-soft); margin-bottom:10px; font-weight:600; }
  h1 { font-size:1.6rem; margin-bottom:20px; }
  label { display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:8px; }
  input[type=password] { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(0,0,0,0.25); color:var(--text-main); font-size:1rem; font-family:inherit; margin-bottom:16px; }
  button { border:none; border-radius:12px; font-family:inherit; font-weight:700; cursor:pointer; }
  .unlock-btn { width:100%; background:var(--accent); color:#1c1410; font-size:1rem; padding:14px; }
  .err { color:#ff8a8a; font-size:0.85rem; margin-top:8px; min-height:1em; }
  #player { display:none; }
  .video-wrap { border-radius:12px; overflow:hidden; background:#000; }
  .video-wrap video { width:100%; display:block; }
  .hint { margin-top:16px; font-size:0.8rem; color:var(--text-muted); line-height:1.5; }
  .ai-note { margin-top:14px; font-size:0.75rem; color:var(--text-muted); line-height:1.5; border-top:1px solid rgba(255,255,255,0.06); padding-top:14px; }
</style>
</head>
<body>
  <main class="card narrow" id="card">
    <div class="heat-bar"></div>
    <p class="eyebrow">Heiße Schicht &middot; Video</p>
    <h1>Video ansehen</h1>

    <div id="lock">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" placeholder="Passwort eingeben" autocomplete="off">
      <button class="unlock-btn" id="unlockBtn">Entsperren</button>
      <p class="err" id="err"></p>
    </div>

    <div id="player">
      <div class="video-wrap">
        <video id="vid" controls playsinline preload="metadata" controlsList="nodownload"></video>
      </div>
      <p class="hint">Dieses Video läuft unabhängig vom Live-Seminar: Du kannst jederzeit pausieren, vor- und zurückspulen sowie Lautstärke und Vollbild selbst steuern.</p>
      <p class="ai-note">Hinweis: Dieses Video wurde mit KI-Unterstützung erstellt (Bild, Ton und Sprecherstimme).</p>
    </div>
  </main>

  <script>
    var KEY = "MME_S2*hitze";
    var VIDEO_URL = "https://media.ennorath.org/uni/hitzeschutz/hitzeschutz_am_arbeitsplatz.mp4";
    var pw = document.getElementById("pw");
    var err = document.getElementById("err");

    function unlock() {
      if (pw.value === KEY) {
        document.getElementById("lock").style.display = "none";
        document.querySelector("h1").style.display = "none";
        document.getElementById("card").classList.remove("narrow");
        document.getElementById("player").style.display = "block";
        // Video-Quelle erst nach dem Entsperren setzen
        var v = document.getElementById("vid");
        v.src = VIDEO_URL;
        v.load();
      } else {
        err.textContent = "Falsches Passwort.";
      }
    }
    document.getElementById("unlockBtn").addEventListener("click", unlock);
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });
  </script>
</body>
</html>
